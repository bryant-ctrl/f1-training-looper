[project]
name = "f1-training-looper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3.3",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
f1-loop = "orchestrator:main"
